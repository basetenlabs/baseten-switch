name: flake

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# Superseded pushes to the same ref stop early instead of finishing a
# build nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # nix build runs the cmd/baseten-switch Go tests inside the sandbox (no
  # HOME, no network beyond loopback), which is what keeps them honest
  # about host-state leaks. -L streams those test logs into the CI log.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: chainguard-actions/DeterminateSystems-magic-nix-cache-action@090be9aa94ef2d96c505badfe395415b71a9efae # v15
        with:
          use-flakehub: false

      - name: Build and test
        run: nix build -L .#baseten-switch

      - name: Version stamp
        run: ./result/bin/baseten-switch --version

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: chainguard-actions/DeterminateSystems-magic-nix-cache-action@090be9aa94ef2d96c505badfe395415b71a9efae # v15
        with:
          use-flakehub: false

      - name: Build and test
        run: nix build -L .#baseten-switch

      - name: Version stamp
        run: ./result/bin/baseten-switch --version

  # aarch64-linux has no runner here; evaluating every declared system
  # still catches flake-level breakage (a dropped platform, a bad attr)
  # without building anything.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build
